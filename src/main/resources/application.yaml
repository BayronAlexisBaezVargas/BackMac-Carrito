spring:
  application:
    name: ms-carrito

  datasource:
    url: jdbc:postgresql://localhost:5434/carrito_db
    username: springuser
    password: springpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: 8082

productos:
  service:
    url: ${PRODUCTOS_SERVICE_URL:http://localhost:8081/api/productos}
